name: Watch SFFK Team App Calendar

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron is UTC. This runs once per hour at minute 17.
    # Using :17 instead of :00 can reduce scheduler congestion.
    - cron: "17 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: sffk-2015-2016-weave-watch
  cancel-in-progress: false

jobs:
  watch:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'stevesimonsoccercoaching/soccercalendars'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check official Team App calendar
        id: watch
        env:
          WEAVE_ICAL_URL: ${{ secrets.SFFK_2015_2016_ICAL_URL }}
        run: |
          python scripts/watch_weave_calendar.py \
            --name "SFFK / Brooklyn Patriots 2015-2016" \
            --state "state/weave/sffk-2015-2016.json" \
            --report "weave-watch-report.md"

      - name: Create or reuse GitHub issue for schedule change
        if: steps.watch.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          CHANGE_ID: ${{ steps.watch.outputs.notification_id }}
        with:
          script: |
            const fs = require('fs');
            const id = process.env.CHANGE_ID;

            if (!/^[0-9a-f]{24}$/.test(id || '')) {
              throw new Error('Invalid notification identifier');
            }

            const report = fs.readFileSync(
              'weave-watch-report.md',
              'utf8'
            );
            const marker = `<!-- weave-notification-id:${id} -->`;

            if (!report.includes(marker)) {
              throw new Error('Notification identifier missing from report');
            }

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 100
              }
            );

            const existing = issues.find(issue =>
              !issue.pull_request &&
              (issue.body || '').includes(marker)
            );

            if (existing) {
              core.info(`Notification already exists: ${existing.html_url}`);
            } else {
              const result = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'SFFK 2015-2016 schedule changed',
                body: report
              });
              core.info(`Notification created: ${result.data.html_url}`);
            }

      - name: Commit updated watch state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git symbolic-ref --quiet --short HEAD)" = main
          if [ -z "$(git status --porcelain -- state/weave/)" ]; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/weave/
          git commit -m "Update SFFK Team App schedule watch state"
          for attempt in 1 2 3; do
            echo "Push attempt $attempt of 3"

            git fetch --no-tags origin main
            git rebase origin/main

            if git push origin HEAD:refs/heads/main; then
              echo "SFFK watch state published successfully."
              exit 0
            fi

            echo "Push rejected or failed; retrying if attempts remain."
          done

          echo "ERROR: Could not publish SFFK watch state."
          exit 1
