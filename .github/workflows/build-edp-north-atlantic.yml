name: Build EDP North Atlantic Calendars

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "data/2026-27/edp-north-atlantic/**/*.xlsx"
      - "config/2026-27/edp-north-atlantic/manifest.json"
      - "scripts/build_soccer_calendars.py"
      - "scripts/build_calendar_index.py"
      - "scripts/report_schedule_changes.py"
      - "scripts/schedule_safety.py"
      - "scripts/sync_missing_soccer_matches.py"
      - "scripts/validate_soccer_manifest.py"
      - "tests/test_validate_soccer_manifest.py"
      - ".github/workflows/build-edp-north-atlantic.yml"

permissions:
  contents: write

concurrency:
  group: soccer-calendar-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-calendars:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Test soccer manifest validator
        run: |
          python -m unittest discover -s tests -p "test_validate_soccer_manifest.py" -v

      
      - name: Validate EDP manifest and XLSX files
        run: |
          python <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from plan_soccer_builds import plan

          events, errors, _ = plan(Path.cwd())
          if errors:
              raise SystemExit('; '.join(errors))

          matches = [
              event for event in events
              if event['organizer'] == 'edp'
              and event['event_id'] == '54578'
          ]

          if len(matches) != 1:
              raise SystemExit(
                  'Expected exactly one EDP event 54578'
              )

          event = matches[0]

          if (
              event['calendar_profile'] != 'metadata-warning-v1'
              or not event['missing_match_sync']
          ):
              raise SystemExit(
                  'EDP missing-match protection is required'
              )

          subprocess.run(
              [
                  sys.executable,
                  'scripts/validate_soccer_manifest.py',
                  event['manifest'],
              ],
              check=True,
          )
          PY

    
      - name: Report EDP schedule changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python scripts/report_schedule_changes.py \
            --base "$BEFORE_SHA" \
            --head "$CURRENT_SHA" \
            --output schedule-change-report.md
          cat schedule-change-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve matches missing from latest EDP exports
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python scripts/sync_missing_soccer_matches.py \
            --manifest config/2026-27/edp-north-atlantic/manifest.json \
            --base "$BEFORE_SHA" \
            --head "$CURRENT_SHA"


      - name: Build EDP North Atlantic calendars
        run: |
          python <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from plan_soccer_builds import plan

          events, errors, _ = plan(Path.cwd())
          if errors:
              raise SystemExit('; '.join(errors))

          matches = [
              event for event in events
              if event['organizer'] == 'edp'
              and event['event_id'] == '54578'
          ]

          if len(matches) != 1:
              raise SystemExit(
                  'Expected exactly one EDP event 54578'
              )

          event = matches[0]

          if (
              event['builder'] != 'scripts/build_soccer_calendars.py'
              or not event['missing_match_sync']
          ):
              raise SystemExit(
                  'Unexpected EDP builder or missing-match policy'
              )

          print(f"Building from: {event['manifest']}", flush=True)

          subprocess.run(
              [
                  sys.executable,
                  event['builder'],
                  event['manifest'],
              ],
              check=True,
          )
          PY


      - name: Build calendar index page
        run: python scripts/build_calendar_index.py

      - name: Show generated changes
        run: |
          echo "Generated EDP calendar, index, and state changes:"
          echo
          git diff -- docs/ state/ || true

      - name: Commit generated calendars and state
        if: github.ref == 'refs/heads/main'
        run: |
          git add docs/ state/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update EDP North Atlantic calendars"
          git push
