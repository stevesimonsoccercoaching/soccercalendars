name: Build CJSL Calendars

on:
  workflow_dispatch:

  push:
    paths:
      - "data/**/*.xlsx"
      - "config/**/manifest.json"
      - "scripts/build_cjsl_calendars.py"
      - "scripts/build_calendar_index.py"
      - "scripts/report_schedule_changes.py"
      - ".github/workflows/build-cjsl-calendars.yml"

permissions:
  contents: write

jobs:
  build-calendars:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Report XLSX schedule changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python scripts/report_schedule_changes.py \
            --base "$BEFORE_SHA" \
            --head "$CURRENT_SHA" \
            --output schedule-change-report.md

          cat schedule-change-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build all CJSL calendars
        run: |
          set -e

          found=0

          while IFS= read -r manifest; do
            found=1
            echo "Building from: $manifest"

            python scripts/build_cjsl_calendars.py "$manifest"
          done < <(
            find config \
              -type f \
              -path "*/cjsl/*/manifest.json" \
              | sort
          )

          if [ "$found" -eq 0 ]; then
            echo "No CJSL manifest files found."
            exit 1
          fi

      - name: Build calendar index page
        run: |
          python scripts/build_calendar_index.py

      - name: Show generated changes
        run: |
          echo "Generated calendar and index changes:"
          echo
          git diff -- docs/ || true

      - name: Commit updated calendars and index
        run: |
          if git diff --quiet -- docs/; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/

          git commit -m "Update generated soccer calendars"

          git push
