name: Build CJSL Calendars

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "data/**/cjsl/**/*.xlsx"
      - "config/**/cjsl/**/manifest.json"
      - "scripts/build_cjsl_calendars.py"
      - "scripts/build_calendar_index.py"
      - "scripts/report_schedule_changes.py"
      - ".github/workflows/build-cjsl-calendars.yml"
      - "scripts/validate_soccer_manifest.py"
      - "tests/test_validate_soccer_manifest.py"
      - "scripts/discover_soccer_manifests.py"
      - "tests/test_discover_soccer_manifests.py"
      - "scripts/plan_soccer_builds.py"
      - "tests/test_plan_soccer_builds.py"
      - "scripts/run_soccer_builds.py"
      - "tests/test_run_soccer_builds.py"
      - "scripts/soccer_paths.py"
      - "tests/test_soccer_paths.py"

permissions:
  contents: write

concurrency:
  group: soccer-calendar-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-calendars:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Test soccer validation and discovery
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Discover registered soccer events
        run: python scripts/discover_soccer_manifests.py --json

      - name: Plan multi-league calendar builds
        run: python scripts/plan_soccer_builds.py --json

      - name: Preview shared multi-league dispatcher
        run: python scripts/run_soccer_builds.py

      
      - name: Validate CJSL manifests and XLSX files
        run: |
          python <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from plan_soccer_builds import plan

          events, errors, _ = plan(Path.cwd())
          if errors:
              raise SystemExit('; '.join(errors))

          cjsl_events = [
              event for event in events
              if event['organizer'] == 'cjsl'
          ]
          if not cjsl_events:
              raise SystemExit('No CJSL events registered')

          for event in cjsl_events:
              subprocess.run(
                  [
                      sys.executable,
                      'scripts/validate_soccer_manifest.py',
                      event['manifest'],
                  ],
                  check=True,
              )
          PY

      - name: Report XLSX schedule changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python scripts/report_schedule_changes.py \
            --base "$BEFORE_SHA" \
            --head "$CURRENT_SHA" \
            --output schedule-change-report.md

          cat schedule-change-report.md >> "$GITHUB_STEP_SUMMARY"


      - name: Build all CJSL calendars
        run: |
          python <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from plan_soccer_builds import plan

          events, errors, _ = plan(Path.cwd())
          if errors:
              raise SystemExit('; '.join(errors))

          cjsl_events = [
              event for event in events
              if event['organizer'] == 'cjsl'
          ]
          if not cjsl_events:
              raise SystemExit('No CJSL events registered')

          for event in cjsl_events:
              if event['builder'] != 'scripts/build_cjsl_calendars.py':
                  raise SystemExit(
                      f"Unexpected CJSL builder: {event['builder']}"
                  )

              print(f"Building from: {event['manifest']}", flush=True)
              subprocess.run(
                  [
                      sys.executable,
                      event['builder'],
                      event['manifest'],
                  ],
                  check=True,
              )
          PY


      - name: Build calendar index page
        run: |
          python scripts/build_calendar_index.py

      - name: Show generated changes
        run: |
          echo "Generated calendar, index, and revision-state changes:"
          echo
          git diff -- docs/ state/ || true

      - name: Commit updated calendars and revision state
        if: github.ref == 'refs/heads/main'
        run: |
          git add docs/ state/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
      
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update generated soccer calendars"

          git push
