name: Build CJSL Calendars

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "data/**/cjsl/**/*.xlsx"
      - "config/**/cjsl/**/manifest.json"
      - "scripts/build_cjsl_calendars.py"
      - "scripts/build_calendar_index.py"
      - "scripts/report_schedule_changes.py"
      - ".github/workflows/build-cjsl-calendars.yml"
      - "scripts/validate_soccer_manifest.py"
      - "tests/test_validate_soccer_manifest.py"
      - "scripts/discover_soccer_manifests.py"
      - "tests/test_discover_soccer_manifests.py"
      - "scripts/plan_soccer_builds.py"
      - "tests/test_plan_soccer_builds.py"
      - "scripts/run_soccer_builds.py"
      - "tests/test_run_soccer_builds.py"

permissions:
  contents: write

concurrency:
  group: soccer-calendar-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-calendars:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Test soccer validation and discovery
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Discover registered soccer events
        run: python scripts/discover_soccer_manifests.py --json

      - name: Plan multi-league calendar builds
        run: python scripts/plan_soccer_builds.py --json

      - name: Preview shared multi-league dispatcher
        run: python scripts/run_soccer_builds.py

      - name: Preview CJSL revision history migration
        run: |
          python scripts/seed_cjsl_revision_views.py \
            --manifest config/2026/cjsl/fall/manifest.json \
            --json

      - name: Verify CJSL v2 real-data parity
        run: |
          python scripts/verify_cjsl_v2_parity.py \
            --manifest config/2026/cjsl/fall/manifest.json


      - name: Export CJSL v2 revision state
        if: github.ref == 'refs/heads/refactor/multi-league-architecture'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from seed_cjsl_revision_views import preview_revision_seed

          state, report = preview_revision_seed(
              Path.cwd(), "config/2026/cjsl/fall/manifest.json"
          )

          actual = (
              len(state["matches"]),
              len(state["views"]),
              sum(len(v) for v in state["views"].values()),
          )
          expected = (225, 37, 296)

          if state["version"] != 2 or actual != expected:
              raise SystemExit(
                  f"Unsafe revision inventory: {actual}"
              )

          original = json.loads(
              Path("state/2026/cjsl/fall/revisions.json")
              .read_text(encoding="utf-8")
          )
          if state["matches"] != original["matches"]:
              raise SystemExit("Legacy revision history changed")

          output = (
              Path(os.environ["RUNNER_TEMP"])
              / "cjsl-v2-state"
              / "revisions.json"
          )
          output.parent.mkdir(parents=True, exist_ok=True)

          payload = (
              json.dumps(state, indent=2, sort_keys=True) + "\n"
          ).encode("utf-8")
          output.write_bytes(payload)

          print(f"Prepared candidate: {output}")
          print(f"Legacy records / views / entries: {actual}")
          print(f"SHA-256: {hashlib.sha256(payload).hexdigest()}")
          print("Repository state unchanged.")
          PY

      - name: Upload CJSL v2 revision artifact
        if: github.ref == 'refs/heads/refactor/multi-league-architecture'
        uses: actions/upload-artifact@v4
        with:
          name: cjsl-fall-2026-revisions-v2
          path: ${{ runner.temp }}/cjsl-v2-state/revisions.json
          retention-days: 30
          if-no-files-found: error


      - name: Validate CJSL manifests and XLSX files
        run: |
          set -e
          found=0

          while IFS= read -r manifest; do
            found=1
            python scripts/validate_soccer_manifest.py "$manifest"
          done < <(
            find config -type f -path "*/cjsl/*/manifest.json" | sort
          )

          if [ "$found" -eq 0 ]; then
            echo "No CJSL manifests found."
            exit 1
          fi

      - name: Report XLSX schedule changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python scripts/report_schedule_changes.py \
            --base "$BEFORE_SHA" \
            --head "$CURRENT_SHA" \
            --output schedule-change-report.md

          cat schedule-change-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build all CJSL calendars
        run: |
          set -e

          found=0

          while IFS= read -r manifest; do
            found=1
            echo "Building from: $manifest"

            python scripts/build_cjsl_calendars.py "$manifest"
          done < <(
            find config \
              -type f \
              -path "*/cjsl/*/manifest.json" \
              | sort
          )

          if [ "$found" -eq 0 ]; then
            echo "No CJSL manifest files found."
            exit 1
          fi

      - name: Build calendar index page
        run: |
          python scripts/build_calendar_index.py

      - name: Show generated changes
        run: |
          echo "Generated calendar, index, and revision-state changes:"
          echo
          git diff -- docs/ state/ || true

      - name: Commit updated calendars and revision state
        if: github.ref == 'refs/heads/main'
        run: |
          git add docs/ state/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
      
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update generated soccer calendars"

          git push
