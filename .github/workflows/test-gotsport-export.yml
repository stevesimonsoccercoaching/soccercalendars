name: Test GotSport Export

on:
  workflow_dispatch:

jobs:
  test-download:
    runs-on: ubuntu-latest

    steps:

      - name: Download GotSport XLSX
        run: |
          curl -L --fail --show-error \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36" \
            -e "https://system.gotsport.com/org_event/events/55206/schedules?team=4264996" \
            -H "Accept: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/octet-stream,*/*" \
            -o gotsport-export.xlsx \
            "https://system.gotsport.com/org_event/events/55206/matches_export?team=4239121"
          

      - name: Verify downloaded file
        run: |
          ls -lh gotsport-export.xlsx
          file gotsport-export.xlsx

          python - <<'PY'
          from zipfile import ZipFile, is_zipfile

          path = "gotsport-export.xlsx"

          if not is_zipfile(path):
              raise SystemExit(
                  "FAILED: GotSport did not return a valid XLSX/ZIP file."
              )

          with ZipFile(path) as z:
              files = set(z.namelist())
              required = {
                  "[Content_Types].xml",
                  "xl/workbook.xml"
              }

              missing = required - files

              if missing:
                  raise SystemExit(
                      f"FAILED: Download is a ZIP file but not a valid XLSX. "
                      f"Missing: {missing}"
                  )

          print("SUCCESS: GotSport returned a valid XLSX file.")
          PY
