name: Test GotSport Export

on:
  workflow_dispatch:

jobs:
  test-download:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Open GotSport and download XLSX
        run: |
          python <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          schedule_url = (
              "https://system.gotsport.com/org_event/events/55206/"
              "schedules?team=4264996"
          )

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              print("Opening:", schedule_url)
              response = page.goto(
                  schedule_url,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              if response:
                  print("HTTP status:", response.status)

              print("Page title:", page.title())

              body = page.locator("body").inner_text()

              if "Export Team Schedule" not in body:
                  print("Export Team Schedule was NOT found.")
                  print("First 2000 characters of page:")
                  print(body[:2000])
                  raise SystemExit(1)

              print("Export Team Schedule found.")

              with page.expect_download(timeout=60000) as download_info:
                  page.get_by_text(
                      "Export Team Schedule",
                      exact=True
                  ).click()

              download = download_info.value
              download.save_as("gotsport-export.xlsx")

              print("Downloaded:", download.suggested_filename)

              browser.close()
          PY

      - name: Verify XLSX
        run: |
          ls -lh gotsport-export.xlsx
          file gotsport-export.xlsx

          python <<'PY'
          from zipfile import ZipFile, is_zipfile

          path = "gotsport-export.xlsx"

          if not is_zipfile(path):
              raise SystemExit(
                  "FAILED: Download is not a valid XLSX file."
              )

          with ZipFile(path) as z:
              names = set(z.namelist())

              if "xl/workbook.xml" not in names:
                  raise SystemExit(
                      "FAILED: ZIP downloaded, but it is not an XLSX workbook."
                  )

          print("SUCCESS: Valid GotSport XLSX downloaded.")
          PY
